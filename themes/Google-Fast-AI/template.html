<div id="app">
    <header class="app-header">
        <h1 class="app-title">NeuralFloppy AI</h1>
        <div class="header-actions">
            <button class="icon-btn" id="newChatBtn" title="Новый чат">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                </svg>
            </button>
        </div>
    </header>

    <div id="chat" class="chat-container" role="log" aria-live="polite"></div>

    <div class="input-area">
        <div class="input-wrapper">
            <div class="attachment-buttons">
                <!-- можно добавить иконки в будущем -->
            </div>
            <textarea
                    id="input"
                    class="chat-input"
                    placeholder="Спроси о чём-нибудь..."
                    rows="1"
                    autofocus
            ></textarea>
            <button id="sendBtn" class="send-btn" aria-label="Отправить сообщение">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
        <div class="mode-selector">
            <label>Режим</label>
            <select id="mode">
                <option value="api">API</option>
                <option value="local">LOCAL</option>
            </select>
            <label>Модель</label>
            <input type="text" id="model" value="openrouter/free" size="18">
            <label>Temp</label>
            <input type="number" id="temp" value="0.7" min="0" max="2" step="0.1" style="width:60px">
            <label class="checkbox-label">
                <input type="checkbox" id="stream" checked> Поток
            </label>
            <button id="statusBtn" class="secondary-btn">Статус</button>
        </div>
    </div>
</div>

<!-- Индикатор загрузки (скрыт по умолчанию) -->
<div id="thinking-indicator" class="thinking-dots" style="display: none;">
    <span></span><span></span><span></span>
</div>
