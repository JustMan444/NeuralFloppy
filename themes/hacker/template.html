<h1>NeuralFloppy Web Console</h1>
<div id="chat"></div>
<div class="panel">
    <label>Mode:</label>
    <select id="mode">
        <option value="api">API</option>
        <option value="local">LOCAL</option>
    </select>
    <label>Model:</label>
    <input type="text" id="model" value="openrouter/free" size="20">
    <label>Temp:</label>
    <input type="number" id="temp" value="0.7" min="0" max="2" step="0.1" style="width:60px">
    <label>Stream:</label>
    <input type="checkbox" id="stream" checked>
    <button onclick="sendCommand(':status')">Status</button>
</div>
<input type="text" id="input" placeholder="Enter your question...">
<button class="send" onclick="send()">Send</button>
